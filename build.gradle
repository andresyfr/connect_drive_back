plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.andresyfr.connect.drive'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
//	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation "org.springframework.boot:spring-boot-starter-web"
	compileOnly 'org.projectlombok:lombok'
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	implementation "org.springframework.boot:spring-boot-starter-oauth2-client:3.1.0"
	
	//Testing
	    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation group: 'org.junit.platform', name: 'junit-platform-runner', version: '1.10.0-M1'
    testImplementation group: 'org.junit.vintage', name: 'junit-vintage-engine', version: '5.10.0-M1'
    testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '5.3.1'
    implementation group: 'org.apache.maven.plugins', name: 'maven-surefire-plugin', version: '3.1.2'
    
    //Documentation openapi
//	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
//	implementation 'org.springdoc:springdoc-openapi-starter-webflux:2.0.2'
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.1.0'
	
	// Gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
	
	
	// For the api google
	implementation 'com.google.api-client:google-api-client:2.7.2' // O la versión más reciente
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.37.0' // O la versión más reciente
    implementation 'com.google.http-client:google-http-client:1.34.1' // O la versión más reciente
//    implementation 'com.google.apis:google-api-services-drive:v3-rev197-1.25.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20240123-2.0.0'
//    implementation 'com.google.api:google-api-services-drive:v3-rev20231027-1.32.2' // O la versión más reciente

	implementation "org.springframework.boot:spring-boot-starter-oauth2-client:3.1.0"
}

tasks.named('test') {
	useJUnitPlatform()
}
